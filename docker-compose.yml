version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: conversion-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: conversion_file
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: conversion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # api:
  #   build:
  #     context: .
  #     dockerfile: apps/api/Dockerfile
  #   container_name: conversion-api
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URL: postgresql://user:password@postgres:5432/conversion_file
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     NODE_ENV: development
  #     API_PORT: 3000
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./apps/api/src:/app/apps/api/src
  #     - storage:/app/storage
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: conversion-worker
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/conversion_file
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
      WORKER_CONCURRENCY: 4
      STORAGE_PATH: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - storage:/app/storage
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: conversion-web
    ports:
      - "5173:80"
    depends_on:
      - redis
    environment:
      VITE_API_URL: http://localhost:3000/api
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage:
    driver: local